[project]
name = "virtual-mouse"
version = "0.1.0"
description = "Gesture-Controlled Virtual Mouse using OpenCV and MediaPipe"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mediapipe>=1.2.2",
    "pyautogui>=0.9.54",
    "pycaw>=20260927",
    "screen-brightness-control>=0.27.2",
]

[project.scripts]
virtual-mouse = "virtual_mouse.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
